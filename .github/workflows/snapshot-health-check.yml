# TrendScan — Snapshot Health Check
#
# Runs every 2 hours and verifies the snapshot was refreshed within the last
# 6 hours. If the snapshot is stale (no successful refresh in 6h+), opens a
# GitHub Issue so the team can investigate.
#
# Why this exists:
#   GitHub Actions cron is unreliable — scheduled runs can be delayed 30min
#   to 6h+, or dropped entirely during peak load. The refresh-snapshot.yml
#   workflow runs 4× daily (every 6h) via GHA cron at 04:00/10:00/16:00/22:00
#   GitHub Actions cron as backup. Without this health check, a missed
#   refresh could leave the site serving stale data for hours before
#   anyone notices.
#
# What this does:
#   1. Fetches public/snapshot.json from the live site
#   2. Parses generated_at timestamp
#   3. If age > 6h, opens (or comments on) a GitHub Issue with 'stale-snapshot' label
#   4. If age > 12h, escalates by adding 'critical' label
#   5. worker-watchdog job: verifies the Cloudflare refresh-trigger worker is
#      still dispatching refresh-snapshot.yml every 4h (detects worker-signature
#      workflow_dispatch runs); opens a 'trigger-worker' issue when dispatches
#      stop appearing. Added 2026-10-22 after the GH_TOKEN expiry incident
#      (worker dead 2 days before anyone noticed) — see the worker-watchdog
#      job header comment below for the incident record.
#
# The 6h threshold gives one full refresh cycle of buffer (refreshes are
# every 4h). The 12h threshold means 3+ consecutive refreshes have been
# missed — strong signal of CI failure or upstream API outage.
#
# THRESHOLD DELIBERATE MISMATCH WITH IN-PRODUCT FRESHNESS BANNER:
#   The in-product FreshnessBanner (src/hooks/useSnapshotFreshness.js) uses
#   tighter thresholds — FRESH <5h, STALE 5-9h (amber), CRITICAL >9h (red).
#   This CI health check uses looser thresholds — FRESH <6h, STALE 6-12h,
#   CRITICAL >12h.
#
#   The gap is intentional. The user-facing banner should warn users BEFORE
#   maintainers get paged, so users can interpret the displayed data with
#   appropriate caution. The CI check opens a GitHub Issue, which is a
#   noisier signal — we want to avoid issue spam from minor cron delays
#   (GitHub Actions routinely delays scheduled runs by 30-90min). The 6h CI
#   threshold gives one full refresh cycle of true buffer beyond what users see.
#
#   If you change one set of thresholds, review the other to decide
#   whether the gap should be preserved, narrowed, or eliminated.

name: Snapshot Health Check

on:
  schedule:
    # Every 2 hours, 24/7
    # (also subject to GitHub Actions cron delays — see refresh-snapshot.yml
    # for the caveat. Worst case: this runs every 3-4h, which still catches
    # staleness within ~12h — much better than no monitoring.)
    - cron: '0 */2 * * *'
  workflow_dispatch:

# Audit F-14-a-10: prevent parallel runs (GitHub Actions cron can cluster-delayed
# runs together). Older runs cancel since the freshest snapshot wins anyway.
concurrency:
  group: snapshot-health-check
  cancel-in-progress: true

permissions:
  issues: write
  actions: read

jobs:
  check:
    name: Check snapshot freshness
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live snapshot.json and check age
        id: check
        run: |
          # Audit F-14-a-3: drop `set -e` so a curl transport failure doesn't kill the
          # script before $GITHUB_OUTPUT is written. Add explicit error handling +
          # --max-time + --retry so transient runner-side issues surface as
          # fetch_failed status rather than silent skip.
          RESPONSE=$(curl -sS --max-time 30 --retry 2 -w "\n%{http_code}" https://trend-scan.github.io/snapshot.json 2>/dev/null) || {
            echo "status=fetch_failed" >> $GITHUB_OUTPUT
            echo "http_code=ERR" >> $GITHUB_OUTPUT
            echo "WARNING: curl transport failure — could not reach trend-scan.github.io"
            exit 0
          }
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "status=fetch_failed" >> $GITHUB_OUTPUT
            echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
            echo "WARNING: Live snapshot.json returned HTTP $HTTP_CODE (expected 200)"
            exit 0
          fi

          GENERATED_AT=$(echo "$BODY" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(d.get('generated_at', ''))
          ")

          if [ -z "$GENERATED_AT" ]; then
            echo "status=no_timestamp" >> $GITHUB_OUTPUT
            echo "WARNING: snapshot.json missing generated_at field"
            exit 0
          fi

          # Audit F-14-a-4: pass GENERATED_AT via env var instead of string-interpolating
          # into Python source. Prevents code injection if an attacker can influence
          # snapshot.json's generated_at field (e.g. via a compromised gh-pages push).
          export TRENDSCAN_GEN_AT="$GENERATED_AT"
          AGE_HOURS=$(python3 -c "
          from datetime import datetime, timezone
          import os
          gen = datetime.fromisoformat(os.environ['TRENDSCAN_GEN_AT'].replace('Z', '+00:00'))
          now = datetime.now(timezone.utc)
          print(f'{(now - gen).total_seconds() / 3600:.2f}')
          ")

          echo "generated_at=$GENERATED_AT" >> $GITHUB_OUTPUT
          echo "age_hours=$AGE_HOURS" >> $GITHUB_OUTPUT

          # Determine status: fresh (<6h), stale (6-12h), critical (>12h)
          # Thresholds match the Cloudflare Worker cron (every 4h, 6× daily).
          STATUS="fresh"
          if (( $(echo "$AGE_HOURS > 12" | bc -l) )); then
            STATUS="critical"
          elif (( $(echo "$AGE_HOURS > 6" | bc -l) )); then
            STATUS="stale"
          fi
          echo "status=$STATUS" >> $GITHUB_OUTPUT

          echo "Snapshot generated_at: $GENERATED_AT"
          echo "Age: $AGE_HOURS hours"
          echo "Status: $STATUS"

      - name: Open or update issue if stale
        if: steps.check.outputs.status == 'stale' || steps.check.outputs.status == 'critical' || steps.check.outputs.status == 'fetch_failed' || steps.check.outputs.status == 'no_timestamp'
        uses: actions/github-script@v9
        with:
          script: |
            const status = '${{ steps.check.outputs.status }}';
            const ageHours = '${{ steps.check.outputs.age_hours }}';
            const generatedAt = '${{ steps.check.outputs.generated_at }}';
            const httpCode = '${{ steps.check.outputs.http_code }}';
            const timestamp = new Date().toISOString();

            const isCritical = status === 'critical' || status === 'fetch_failed';
            const label = isCritical ? 'stale-snapshot-critical' : 'stale-snapshot';

            // Ensure both labels exist
            // Audit F-14-a-2: label descriptions now match the actual 6h/12h thresholds.
            for (const [name, color, desc] of [
              ['stale-snapshot', 'f5c842', 'Snapshot is stale (6-12h old) — investigate refresh-snapshot failures'],
              ['stale-snapshot-critical', 'ff4444', 'Snapshot is critically stale (>12h) or unreachable — data is outdated'],
            ]) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner, repo: context.repo.repo, name,
                });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner, repo: context.repo.repo,
                    name, color, description: desc,
                  });
                } else { throw e; }
              }
            }

            // Look for existing OPEN stale-snapshot issue (any severity).
            // Audit (2026-09-08, issue #5 stuck open for 2 days): the REST
            // `labels` param is AND semantics — comma-separated requires ALL
            // labels. A base stale issue carries only 'stale-snapshot'
            // ('stale-snapshot-critical' is ADDed on escalation), so the old
            // combined query 'stale-snapshot,stale-snapshot-critical' matched
            // zero issues and the comment/escalate paths silently no-op'd.
            // Query each label separately and merge (true OR), newest first.
            const [r1, r2] = await Promise.all([
              github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                labels: 'stale-snapshot', state: 'open', per_page: 10,
              }),
              github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                labels: 'stale-snapshot-critical', state: 'open', per_page: 10,
              }),
            ]);
            const _seen = new Map();
            for (const issue of [...r1.data, ...r2.data]) {
              if (issue.state === 'open') _seen.set(issue.number, issue);
            }
            const existing = { data: [..._seen.values()].sort((a, b) => b.number - a.number) };

            let title, body, labels;
            if (status === 'fetch_failed') {
              title = `Snapshot health check: live site returned HTTP ${httpCode}`;
              body = [
                `**Status:** CRITICAL — live snapshot.json unreachable`,
                ``,
                `**Detected at:** ${timestamp}`,
                `**HTTP code:** ${httpCode} (expected 200)`,
                ``,
                `The health check could not fetch https://trend-scan.github.io/snapshot.json.`,
                `This could indicate:`,
                `- GitHub Pages is down or deploying`,
                `- The snapshot.json file is missing from the gh-pages branch`,
                `- Network issue from the runner`,
                ``,
                `**To resolve:**`,
                `1. Manually verify https://trend-scan.github.io/snapshot.json loads in a browser`,
                `2. Check the latest deploy.yml run for failures`,
                `3. If the file is genuinely missing, manually trigger refresh-snapshot.yml`,
              ].join('\n');
              labels = ['stale-snapshot-critical'];
            } else if (status === 'no_timestamp') {
              title = `Snapshot health check: generated_at field missing`;
              body = [
                `**Status:** CRITICAL — snapshot.json is malformed`,
                ``,
                `**Detected at:** ${timestamp}`,
                ``,
                `The live snapshot.json was fetched successfully but is missing the 'generated_at' field.`,
                `This indicates a build_snapshot.js bug or a corrupted snapshot.`,
              ].join('\n');
              labels = ['stale-snapshot-critical'];
            } else {
              const severity = status === 'critical' ? 'CRITICAL' : 'STALE';
              title = `Snapshot ${severity.toLowerCase()}: ${parseFloat(ageHours).toFixed(1)}h old`;
              body = [
                `**Status:** ${severity}`,
                ``,
                `**Detected at:** ${timestamp}`,
                `**Last successful refresh:** ${generatedAt}`,
                `**Age:** ${ageHours} hours`,
                ``,
                status === 'critical'
                  ? `The snapshot has not been refreshed in over 24 hours. This means 4+ scheduled refresh runs have failed or been dropped by GitHub Actions.`
                  : `The snapshot has not been refreshed in 8-24 hours. This means 1-3 scheduled refresh runs have failed or been dropped by GitHub Actions.`,
                ``,
                `**Impact:**`,
                `- Signal page verdicts are based on stale data`,
                `- Macro regime quadrant may be outdated`,
                `- Board header BTC Signal + Cash % are stale`,
                `- FreshnessBanner component should be visible to users`,
                ``,
                `**To resolve:**`,
                `1. Check https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/refresh-snapshot.yml for failed runs`,
                `2. Look for the 'ci-failure' label on Issues — refresh-snapshot's own alert-on-failure job may have already opened one`,
                `3. Manually trigger refresh-snapshot.yml via workflow_dispatch`,
                `4. Verify the live snapshot.json updates after the manual run completes`,
                ``,
                `**Reference:** Expected refresh cadence is every 6h (04:00, 10:00, 16:00, 22:00 UTC).`,
                `GitHub Actions cron is known to delay scheduled runs by 30min-6h+.`,
              ].join('\n');
              labels = [label];
            }

            if (existing.data.length > 0) {
              // Comment on the most recent existing issue
              const issue = existing.data[0];
              const comment = [
                `### Update — ${timestamp}`,
                ``,
                `Status: **${status.toUpperCase()}**`,
                ...(status === 'fetch_failed' ? [`HTTP code: ${httpCode}`] : []),
                ...(status === 'stale' || status === 'critical'
                  ? [`Age: ${parseFloat(ageHours).toFixed(1)}h`, `Last refresh: ${generatedAt}`]
                  : []),
                ``,
                status === 'fresh'
                  ? `✅ Snapshot has recovered — this issue can be closed.`
                  : `Issue persists. See original report above for resolution steps.`,
              ].join('\n');
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body: comment,
              });
              // Update labels if severity escalated
              if (isCritical && !issue.labels.some(l => l.name === 'stale-snapshot-critical')) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, labels: ['stale-snapshot-critical'],
                });
              }
              console.log(`Commented on existing issue #${issue.number}`);
            } else {
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels,
              });
              console.log(`Opened new issue #${newIssue.data.number}: ${newIssue.data.html_url}`);
            }

      - name: Close stale issues if snapshot recovered
        if: steps.check.outputs.status == 'fresh'
        uses: actions/github-script@v9
        with:
          script: |
            // If the snapshot is fresh, auto-close any open stale-snapshot issues.
            // Same AND-semantics fix as above: query each label separately and
            // merge — the old combined filter matched zero issues, so this step
            // silently no-op'd on every fresh run while issue #5 stayed open.
            const [c1, c2] = await Promise.all([
              github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                labels: 'stale-snapshot', state: 'open', per_page: 20,
              }),
              github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                labels: 'stale-snapshot-critical', state: 'open', per_page: 20,
              }),
            ]);
            const _closeSeen = new Map();
            for (const issue of [...c1.data, ...c2.data]) {
              if (issue.state === 'open') _closeSeen.set(issue.number, issue);
            }
            const existing = { data: [..._closeSeen.values()].sort((a, b) => b.number - a.number) };
            for (const issue of existing.data) {
              const comment = [
                `### ✅ Resolved — ${new Date().toISOString()}`,
                ``,
                `Snapshot has recovered. Last refresh: ${'${{ steps.check.outputs.generated_at }}'} (age: ${{ steps.check.outputs.age_hours }}h).`,
                `Closing this issue automatically. If staleness recurs, a new issue will be opened.`,
              ].join('\n');
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body: comment,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
              console.log(`Closed issue #${issue.number}`);
            }

      - name: Summary
        run: |
          STATUS="${{ steps.check.outputs.status }}"
          AGE="${{ steps.check.outputs.age_hours }}"
          echo "### Snapshot Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$STATUS" = "fresh" ]; then
            echo "✅ Snapshot is fresh (${AGE}h old — under 8h threshold)" >> $GITHUB_STEP_SUMMARY
          elif [ "$STATUS" = "stale" ]; then
            echo "⚠️ Snapshot is STALE (${AGE}h old — between 8h and 24h)" >> $GITHUB_STEP_SUMMARY
            echo "Opened or commented on a stale-snapshot issue." >> $GITHUB_STEP_SUMMARY
          elif [ "$STATUS" = "critical" ]; then
            echo "🚨 Snapshot is CRITICAL (${AGE}h old — over 24h)" >> $GITHUB_STEP_SUMMARY
            echo "Opened or commented on a stale-snapshot-critical issue." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Health check failed: $STATUS" >> $GITHUB_STEP_SUMMARY
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Trigger-worker watchdog (added 2026-10-22, after the 2026-10-20 incident)
  #
  # INCIDENT RECORD: the Cloudflare refresh-trigger worker stopped dispatching
  # refresh-snapshot.yml at 2026-10-20 08:00 UTC. Root cause: the GH_TOKEN
  # secret (fine-grained PAT created with the worker on 2026-07-22, 90-day
  # default expiry) expired exactly 90 days later. Every cron fire since then
  # failed the workflow_dispatch call with HTTP 401 — no run created, no
  # alert. GitHub's own scheduled runs kept the snapshot semi-fresh, so the
  # stale-snapshot check above only saw "8.7h stale" (issue #11, auto-closed
  # on recovery); nothing pinpointed the dispatch layer for 2 days until the
  # user noticed and rotated the token (fixed 2026-10-22 ~06:00 UTC).
  #
  # This job watches the actual symptom of a dead worker: the ABSENCE of
  # worker-signature dispatch runs. A worker fire is identifiable as
  # event=workflow_dispatch + created_at within 15min after a 4h UTC boundary
  # (Cloudflare cron `0 */4 * * *` = 00/04/08/12/16/20 UTC, 1-2min precision;
  # dispatch runs are created immediately on API call, unlike GHA scheduled
  # runs which get queued/delayed — so a wide 15min signature window is safe
  # and human manual dispatches at random times don't match).
  #
  # Thresholds (worker cadence = 4h): STALE > 9h (2 consecutive missed fires),
  # CRITICAL > 13h (3+ missed). In 3 months of operation (Jul 22 - Oct 20)
  # the worker never missed two fires in a row, so false positives are
  # effectively nil while detection latency stays under half a day.
  #
  # Label note: single 'trigger-worker' label by design — the check job's
  # two-label stale-snapshot queries hit REST AND-semantics bugs twice
  # (issues #5 and #11-era comment paths silently no-op'd). One label, one
  # query, no merging needed.
  worker-watchdog:
    name: Trigger-worker watchdog
    runs-on: ubuntu-latest
    steps:
      - name: Check trigger-worker dispatch liveness
        id: watchdog
        uses: actions/github-script@v9
        with:
          script: |
            const STALE_H = 9;    // 2 consecutive missed 4h fires
            const CRIT_H = 13;    // 3+ missed fires
            const WF = 'refresh-snapshot.yml';

            // Newest-first list of recent refresh-snapshot runs (100 runs
            // covers ~10 days of history; threshold checks need <14h).
            const res = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: WF,
              per_page: 100,
            });
            const runs = res.data.workflow_runs || [];
            const now = Date.now();

            // Worker signature: dispatch run created within 15min after a
            // 4h UTC boundary (00/04/08/12/16/20). See job header comment.
            const isWorkerFire = (r) => {
              if (r.event !== 'workflow_dispatch') return false;
              const d = new Date(r.created_at);
              return d.getUTCHours() % 4 === 0 && d.getUTCMinutes() < 15;
            };
            const workerFires = runs.filter(isWorkerFire);
            const lastFire = workerFires.length ? workerFires[0] : null;
            const ageH = lastFire
              ? (now - new Date(lastFire.created_at)) / 3.6e6
              : Infinity;

            // Diagnostics: ALL dispatch runs (worker + human) in last 24h.
            const disp24 = runs.filter(r =>
              r.event === 'workflow_dispatch' &&
              (now - new Date(r.created_at)) < 864e5).length;

            const status = ageH > CRIT_H ? 'critical' : ageH > STALE_H ? 'stale' : 'fresh';

            core.setOutput('status', status);
            core.setOutput('age_hours',
              lastFire ? ageH.toFixed(1) : 'none-in-last-100-runs');
            core.setOutput('last_fire', lastFire ? lastFire.created_at : 'none');
            core.setOutput('dispatches_24h', String(disp24));
            console.log(`Worker watchdog: status=${status} ` +
              `lastWorkerFire=${lastFire ? lastFire.created_at : 'none'} ` +
              `age=${lastFire ? ageH.toFixed(1) : 'unknown'}h ` +
              `dispatches24h=${disp24} (of ${runs.length} runs listed)`);

            // Single-label management (see job header comment for rationale).
            const LABEL = 'trigger-worker';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner, repo: context.repo.repo, name: LABEL,
              });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  name: LABEL, color: 'ff9933',
                  description: 'Cloudflare refresh-trigger worker not dispatching (cron or GH_TOKEN failure)',
                });
              } else { throw e; }
            }

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: LABEL, state: 'open', per_page: 10,
            });
            const existing = open.data[0] || null;

            if (status === 'fresh') {
              // Healthy: close any open watchdog issue from a prior outage.
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  body: [
                    `### ✅ Worker recovered — ${new Date().toISOString()}`,
                    ``,
                    `Last worker-signature dispatch: ${lastFire.created_at} (${ageH.toFixed(1)}h ago).`,
                    `Closing automatically. If dispatches stop again, a new issue will be opened.`,
                  ].join('\n'),
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, state: 'closed',
                });
                console.log(`Closed recovered issue #${existing.number}`);
              }
              return;
            }

            // status is 'stale' or 'critical': open or comment.
            const sev = status === 'critical' ? 'CRITICAL' : 'STALE';
            const timestamp = new Date().toISOString();
            const title = `Trigger worker not dispatching: last fire ${
              lastFire ? lastFire.created_at : 'unknown'}`;
            const body = [
              `**Status:** ${sev} — Cloudflare refresh-trigger worker has not dispatched ${WF}`,
              ``,
              `**Detected at:** ${timestamp}`,
              `**Last worker-signature dispatch:** ${
                lastFire ? lastFire.created_at : 'none in the last 100 runs'}`,
              `**Age:** ${
                lastFire ? ageH.toFixed(1) + ' hours' : '>10 days (no worker fire in run history)'}`,
              `**workflow_dispatch runs in last 24h:** ${disp24} (worker + manual combined)`,
              ``,
              `**What this means:** Cloudflare's cron is either no longer firing, or the worker's`,
              `GH_TOKEN secret is being rejected by GitHub (expired/revoked PAT → HTTP 401 on the`,
              `dispatch call → NO run is created, so no failure alert fires either). GitHub's own`,
              `scheduled runs may still be keeping the snapshot semi-fresh — compare the two event`,
              `types at https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/${WF}`,
              `('schedule' runs continuing while 'workflow_dispatch' runs stopped = this failure).`,
              ``,
              `**Diagnosis, in order of likelihood:**`,
              `1. **GH_TOKEN expired** — fine-grained PATs default to 90-day expiry. This exact`,
              `   failure occurred 2026-10-20 (worker deployed 2026-07-22 + 90 days). Regenerate`,
              `   the PAT (Actions: read+write on this repo), update the GH_TOKEN secret in the`,
              `   Cloudflare Worker dashboard, then verify a dispatch run appears at the next`,
              `   4h boundary (00/04/08/12/16/20 UTC).`,
              `2. Worker deleted or cron trigger removed — Cloudflare dashboard → Workers & Pages`,
              `   → trendscan-refresh-trigger → Settings → Triggers → Cron Triggers.`,
              `3. Worker runtime error — Cloudflare dashboard → worker → Real-time Logs around`,
              `   the last 4h boundary.`,
              `4. Manual test (if WORKER_TOKEN is set): POST`,
              `   https://trendscan-refresh-trigger.drew-724.workers.dev/trigger with header`,
              `   X-Worker-Token — see cloudflare/REFRESH_TRIGGER_SETUP.md (Troubleshooting).`,
              ``,
              `**Reference:** cloudflare/REFRESH_TRIGGER_SETUP.md — setup, token rotation, and`,
              `the 2026-10-20 incident record.`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `### Update — ${timestamp}\n\nStatus: **${sev}** — last worker-signature dispatch ` +
                  `${lastFire ? lastFire.created_at : 'unknown'} (${
                    lastFire ? ageH.toFixed(1) : '>10'}h ago). Issue persists.`,
              });
              console.log(`Commented on existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [LABEL],
              });
              console.log(`Opened issue #${created.data.number}: ${created.data.html_url}`);
            }

      - name: Worker-watchdog summary
        run: |
          WS="${{ steps.watchdog.outputs.status }}"
          WA="${{ steps.watchdog.outputs.age_hours }}"
          LF="${{ steps.watchdog.outputs.last_fire }}"
          echo "### Trigger-Worker Watchdog" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$WS" = "fresh" ]; then
            echo "✅ Cloudflare trigger worker dispatched recently (last fire: ${LF}, ${WA}h ago)" >> $GITHUB_STEP_SUMMARY
          else
            echo "🚨 Trigger worker ${WS}: last worker-signature dispatch ${LF} (${WA}h ago) — 'trigger-worker' issue opened/updated" >> $GITHUB_STEP_SUMMARY
          fi
