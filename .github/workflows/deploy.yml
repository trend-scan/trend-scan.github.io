# TrendScan — Build & Deploy to GitHub Pages
#
# Triggers:
#   1. Push to main (any change to src/, scripts/, public/, index.html, etc.)
#   2. Daily at 23:00 UTC (safety-net deploy — refresh-snapshot.yml also triggers
#      a deploy via workflow_dispatch after each of its 4× daily runs at
#      04:00/10:00/16:00/22:00 UTC, so this daily cron is purely a backup)
#   3. Manual dispatch from the Actions tab
#
# What it does:
#   1. Installs Node + deps
#   2. Runs scripts/build_snapshot.js — fetches FRED macro data server-side
#      using the FRED_API_KEY secret, writes public/snapshot.json
#   3. Runs npm run build — Vite builds the production bundle to dist/
#   4. Copies snapshot.json into dist/ (so it's served at /snapshot.json)
#   5. Pushes dist/ contents to the gh-pages branch (deploying the live site)
#
# Required secrets (Settings → Secrets and variables → Actions):
#   FRED_API_KEY  — free key from https://fred.stlouisfed.org/docs/api/api_key.html

name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/deploy.yml'
  schedule:
    # 23:00 UTC daily = 7pm ET (1 hour after the 22:00 refresh-snapshot run,
    # which itself triggers a deploy via workflow_dispatch). This cron is a
    # safety-net: if refresh-snapshot fails to dispatch the deploy for any
    # reason, this daily build ensures the site is still rebuilt once a day.
    - cron: '0 23 * * *'
  workflow_dispatch:

# Don't run concurrent deploys for the same ref
concurrency:
  group: 'pages-deploy'
  cancel-in-progress: true

permissions:
  contents: write   # needed to push to gh-pages branch
  pages: write
  id-token: write
  issues: write     # needed to open issues on CI failure (alerting)

jobs:
  build:
    name: Build & deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history to push back to gh-pages

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (non-blocking)
        # F-14-a-15 (2026-08-26): lint stays non-blocking — pre-existing
        # codebase has stylistic warnings that don't affect runtime. Can be
        # promoted to blocking once the lint backlog is cleared.
        run: npm run lint || echo "⚠ Lint warnings (non-blocking)"

      - name: Typecheck (BLOCKING)
        # F-14-a-15 (2026-08-26): promoted from non-blocking to blocking.
        # Previously TS type errors shipped to production silently because
        # the step had `|| echo "⚠ ..."` swallowing the failure. Now a
        # typecheck failure fails the build, preventing regressions like
        # the July 4 incident where a refactored function signature shipped
        # broken at runtime while CI was 'passing'.
        run: npm run typecheck

      - name: CSP verification (non-blocking)
        # Verifies every external URL referenced in src/ is allowed by the
        # Content-Security-Policy in index.html. Catches the regression where
        # someone adds a new API endpoint but forgets to update the CSP.
        # F-14-a-15: kept non-blocking for now — CSP verification is a defense-
        # in-depth check; promoting it to blocking would fail the build on
        # any new external resource addition, which is overly strict.
        run: python3 scripts/verify-csp.py || echo "⚠ CSP verification warnings (non-blocking)"

      - name: Build FRED snapshot
        # F-14-a-14 (2026-08-26): the redundant build_snapshot.js call that
        # previously ran here (writing both snapshot.json AND
        # snapshot.tradfi.json, then immediately overwriting snapshot.tradfi.json
        # with the gh-pages version in the next step) has been removed. The
        # refresh-snapshot.yml workflow (the authoritative snapshot builder,
        # runs 4× daily via Cloudflare cron) already builds both files. This
        # deploy.yml step now only runs build_snapshot.js when triggered by
        # a push to main (so the deployed site matches the latest code),
        # not on the daily cron (which would be redundant with refresh-snapshot).
        #
        # Net savings: ~30s CI time + 470 Yahoo API calls per deploy.
        # The daily 23:00 UTC cron safety-net deploy now relies on
        # refresh-snapshot's workflow_dispatch trigger (which already fires
        # a deploy after each 4-hourly snapshot rebuild).
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        timeout-minutes: 10
        run: node scripts/build_snapshot.js
        # Skip on daily cron — refresh-snapshot.yml already runs 4× daily
        # and triggers a deploy via workflow_dispatch after each run.
        if: github.event_name != 'schedule'

      # Fetch snapshot.tradfi.json from the gh-pages branch.
      # It's NOT committed to main (gitignored) to prevent repository bloat.
      # The refresh-snapshot workflow pushes it directly to gh-pages.
      # On first deploy (no gh-pages branch yet), build_snapshot.js creates
      # it in public/ — the next step copies it to dist/ regardless.
      #
      # Audit F-14-a-9: write `git show` output to a temp file first, then move
      # into place ONLY on success. The previous `git show ... > public/snapshot.tradfi.json`
      # form truncated the freshly-built file to 0 bytes when `git show` failed
      # (the `>` redirect opens+truncates BEFORE the command runs, and `|| true`
      # swallowed the failure).
      - name: Fetch snapshot.tradfi.json from gh-pages
        run: |
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            git fetch origin gh-pages --depth=1
            if git show origin/gh-pages:snapshot.tradfi.json > /tmp/snapshot.tradfi.json 2>/dev/null; then
              mv /tmp/snapshot.tradfi.json public/snapshot.tradfi.json
              echo "✓ Fetched snapshot.tradfi.json from gh-pages branch"
            else
              echo "ℹ gh-pages has no snapshot.tradfi.json — using locally built file"
            fi
          else
            echo "ℹ gh-pages branch doesn't exist yet — using locally built snapshot.tradfi.json"
          fi

      - name: Build site (Vite)
        env:
          # VITE_YAHOO_PROXY_URL is just a URL (not a secret), safe to expose.
          VITE_YAHOO_PROXY_URL: ${{ secrets.VITE_YAHOO_PROXY_URL }}
          # Shared-secret token for the Cloudflare Worker. Prevents quota abuse
          # via non-browser requests. This IS baked into the bundle, but that's
          # acceptable: the token is only useful for THIS worker, and rotating
          # it is trivial (update secret + redeploy worker + bundle).
          VITE_YAHOO_PROXY_TOKEN: ${{ secrets.VITE_YAHOO_PROXY_TOKEN }}
          # FactorWatch feature flag — set to 'true' to enable TradFi factor
          # signals, narrative banner, divergence chart, and revision table.
          # Defaults to off — components render nothing when not 'true'.
          VITE_ENABLE_FACTORWATCH: ${{ secrets.VITE_ENABLE_FACTORWATCH }}
          # Signal page feature flag — set to 'true' to enable the /signal route
          # with STRONG/WEAK/NEUTRAL verdicts for BTC, Majors, and Cash.
          VITE_ENABLE_SIGNAL_PAGE: ${{ secrets.VITE_ENABLE_SIGNAL_PAGE }}
          # NOTE: Paid API keys (Massive/Polygon, Twelve Data, Alpha Vantage)
          # are NO LONGER passed as VITE_ env vars. VITE_-prefixed vars get
          # statically inlined into the client bundle, exposing the keys to
          # anyone who inspects the JS. Users who want these sources must
          # set them at runtime via localStorage:
          #   localStorage.setItem('MASSIVE_API_KEY', '...')
          #   localStorage.setItem('TWELVEDATA_KEY', '...')
          #   localStorage.setItem('ALPHAVANTAGE_KEY', '...')
        run: npm run build

      - name: Copy snapshot files into build output
        run: |
          mkdir -p dist
          cp public/snapshot.json dist/snapshot.json
          cp public/snapshot.tradfi.json dist/snapshot.tradfi.json
          # .nojekyll tells GitHub Pages to serve files as-is (no Jekyll processing)
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        # Retry up to 3 times on failure. GitHub Pages deployment sometimes
        # fails transiently with "Deployment failed, try again later."
        # (seen July 4 and July 5). The artifact is already uploaded by
        # the previous step, so retrying just asks GitHub to deploy it again.
        uses: actions/deploy-pages@v4
        id: deploy
        continue-on-error: true

      - name: Retry deploy if failed
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "First deploy attempt failed. Waiting 30s and retrying..."
          sleep 30
        # The actual retry happens in the next step

      - name: Deploy to GitHub Pages (retry)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Post-deploy smoke test
        # Wait for the Pages CDN to propagate, then verify the live site
        # responds with HTTP 200 and serves the expected HTML. Catches
        # silent deployment failures (the kind that caused the July 4
        # incident where CI was "passing" but no deploy actually shipped).
        run: |
          sleep 15
          echo "Polling https://trend-scan.github.io/ ..."
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://trend-scan.github.io/ || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Live site returned HTTP 200 (attempt $i)"
              break
            fi
            echo "  attempt $i: HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          if [ "$STATUS" != "200" ]; then
            echo "⚠ Live site did not return HTTP 200 after 5 attempts (last: $STATUS)"
            echo "  This may indicate a deployment propagation delay or a real failure."
            echo "  Manual verification recommended: https://trend-scan.github.io/"
            # Non-blocking: don't fail the workflow, just warn. The deploy
            # step itself already passed, so the artifact is uploaded; the
            # smoke test is purely informational.
          fi
          # Also verify snapshot files are served (FRED data is critical for
          # the macro regime tab to work; tradfi snapshot is lazy-loaded by Board/Macro).
          SNAP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://trend-scan.github.io/snapshot.json || echo "000")
          if [ "$SNAP_STATUS" = "200" ]; then
            echo "✓ Live snapshot.json returned HTTP 200"
          else
            echo "⚠ Live snapshot.json returned HTTP $SNAP_STATUS (expected 200)"
          fi
          TRADFI_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://trend-scan.github.io/snapshot.tradfi.json || echo "000")
          if [ "$TRADFI_STATUS" = "200" ]; then
            echo "✓ Live snapshot.tradfi.json returned HTTP 200"
          else
            echo "⚠ Live snapshot.tradfi.json returned HTTP $TRADFI_STATUS (expected 200)"
          fi

      - name: Summary
        run: |
          echo "### Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Snapshot size:** $(du -h dist/snapshot.json | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle size:** $(du -sh dist/assets | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed to:** https://trend-scan.github.io/" >> $GITHUB_STEP_SUMMARY
          echo "- **Build time:** $(date -u)" >> $GITHUB_STEP_SUMMARY

  # ── Failure alerting ─────────────────────────────────────────────────────
  # If the build/deploy fails, open a GitHub Issue so it's not silently
  # ignored. Uses a "ci-failure" label + dedup logic: if an open issue with
  # that label already exists, comment on it instead of opening a new one.
  # This prevents issue spam when the same failure recurs across multiple runs.
  alert-on-failure:
    name: Open GitHub Issue on failure
    runs-on: ubuntu-latest
    needs: build
    # 2026-10-06: widened to 'cancelled' as well -- a hung/timed-out build
    # job concludes 'cancelled', which the old failure-only check silently
    # ignored (refresh run #37367063306, 2026-10-05, filed no issue for
    # exactly this reason). Superseded-by-newer-run cancels (concurrency
    # cancel-in-progress is true here) are filtered inside the script.
    if: always() && (needs.build.result == 'failure' || needs.build.result == 'cancelled')
    permissions:
      issues: write
      actions: read
    steps:
      - name: Find or open issue
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'ci-failure';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const runId = context.runId;
            const timestamp = new Date().toISOString();
            const result = '${{ needs.build.result }}';

            // 2026-10-06: deploy.yml's concurrency group uses
            // cancel-in-progress: true, so a 'cancelled' build is usually an
            // INTENTIONAL supersede by a newer push. Only alert when nothing
            // newer took over (hang / runner loss / manual abort).
            if (result === 'cancelled') {
              const newer = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: 'deploy.yml', per_page: 15,
              });
              const superseded = newer.data.workflow_runs.some(r =>
                r.run_number > context.runNumber &&
                (r.status === 'queued' || r.status === 'in_progress' || r.conclusion === 'success')
              );
              if (superseded) {
                console.log(`Run #${context.runNumber} was cancelled as superseded by a newer run -- no alert.`);
                return;
              }
            }

            // Ensure the label exists (create if missing)
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: 'ff4444',
                  description: 'CI workflow failed — needs investigation',
                });
              } else {
                throw e;
              }
            }

            // Look for an existing OPEN issue with the ci-failure label
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 10,
            });

            const body = [
              `**Workflow:** [${context.workflow}](${runUrl})`,
              ``,
              `**Run:** #${context.runNumber} (\`${runId}\`)`,
              `**Result:** ${result} (failure = red step; cancelled = hang/timeout/abort)`,
              `**Trigger:** ${context.eventName} on \`${context.ref}\``,
              `**Failed at:** ${timestamp}`,
              ``,
              `**Failure context:**`,
              `- The build job failed. See the run URL above for the failing step and logs.`,
              `- This alert was opened automatically by the \`alert-on-failure\` job in \`deploy.yml\`.`,
              ``,
              `**To resolve:**`,
              `1. Open the run URL and identify the failing step.`,
              `2. Investigate the cause (most common: snapshot fetch failure, FRED API outage, Pages deploy flake, build/lint error).`,
              `3. Re-run the workflow after fixing the root cause.`,
              `4. Close this issue once a green run completes. If you close it without fixing, the next failure will open a new one.`,
              ``,
              `> Auto-generated by TrendScan CI failure alerting.`,
            ].join('\n');

            if (existing.data.length > 0) {
              // Comment on the existing open issue (dedup)
              const issue = existing.data[0];
              const comment = [
                `### ⚠️ CI failure recurrence — ${timestamp}`,
                ``,
                `Workflow [${context.workflow}](${runUrl}) run #${context.runNumber} failed.`,
                ``,
                `This is a recurring failure — the original issue (#${issue.number}) remains open.`,
                `Linked run: ${runUrl}`,
              ].join('\n');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: comment,
              });
              console.log(`Commented on existing issue #${issue.number}`);
            } else {
              // Open a new issue
              const title = `CI failure: ${context.workflow} run #${context.runNumber}`;
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              console.log(`Opened new issue #${newIssue.data.number}: ${newIssue.data.html_url}`);
            }

